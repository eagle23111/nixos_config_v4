config_version = 12

[backdrop]
enabled = true

[bar]
order = [ "default" ]

    [bar.default]
    auto_hide = true
    background_opacity = 0.69999998435378075
    capsule_group = []
    capsule_thickness = 0.74999998696148396
    end = [ "media", "tray", "notifications", "clipboard", "network", "volume", "brightness", "battery", "session" ]
    layer = "overlay"
    margin_ends = 400
    padding = 10
    radius = 13
    reserve_space = false
    widget_spacing = 10

        [bar.default.dead_zone.actions]
        scroll_down = "workspace-switch next"
        scroll_up = "workspace-switch prev"

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 330.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 976.0
    cy = 938.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.80000000000000004
        background_radius = 32.0
        center_password_text = false
        input_opacity = 0.29999999999999999
        input_radius = 32.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = false
        show_media = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

[nightlight]
enabled = true

[shell]
font_family = "Terminess Nerd Font"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
screen_time_enabled = true

    [shell.panel]
    open_near_click_launcher = true
    transparency_mode = "glass"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "notify-send 'Noctalia' 'Custom session entry'"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

[theme]
builtin = "Ayu"
community_palette = "Kanagawa Dragon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [
        "opencode",
        "pi-agent",
        "zen-browser",
        "discord",
        "blender",
        "gimp",
        "libreoffice",
        "neovim",
        "vscode",
        "prismlauncher",
        "steam",
        "fastfetch"
    ]

[wallpaper]
directory = "/home/mortal/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/mortal/Pictures/Wallpapers/gargantua-black-3840x2160-9621.jpg"

    [wallpaper.last]
    path = "/home/mortal/Pictures/Wallpapers/gargantua-black-3840x2160-9621.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/mortal/Pictures/Wallpapers/gargantua-black-3840x2160-9621.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/mortal/Pictures/Wallpapers/mist_forest_1(2).png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-fruit-salad"